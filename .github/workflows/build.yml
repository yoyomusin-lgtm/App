name: Build Unsigned IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 整理網頁檔案並初始化 Capacitor
        run: |
          mkdir -p www
          cp *.html *.css *.js www/ 2>/dev/null || true
          npm install
          npx cap init "MyApp" "com.example.myapp" --web-dir=www
          npx cap add ios
          npx cap sync ios

      - name: 編譯並打包成未簽名 IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r MyApp.ipa Payload

      - name: 上傳 IPA 供下載
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-IPA
          path: ios/App/MyApp.ipa
